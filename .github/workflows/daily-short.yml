name: Generate and Upload Shorts (2-3x/day)

on:
  schedule:
    # Spread across the day (UTC) so it doesn't look like a bot firing on
    # the same second daily - roughly US morning / afternoon / evening.
    - cron: "0 14 * * *"    # ~10am ET / 7am PT
    - cron: "0 19 * * *"    # ~3pm ET / 12pm PT
    - cron: "30 23 * * *"   # ~7:30pm ET / 4:30pm PT
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Random jitter delay
        run: sleep $((RANDOM % 1200))   # 0-20 min random delay, avoids exact-clock posting pattern

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "private"   # change to "public" once you trust the output
          USE_TRENDING: "true"        # pull from Reddit trending (niche subs) with safety filtering; falls back to topics.json
        run: python generate_short.py

      - name: Commit updated topic pointer
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add topics.json
          git commit -m "chore: advance topic pointer [skip ci]" || echo "nothing to commit"
          git push
