name: Generate and Upload Shorts (self-chained, ~15 min gap after each run)

# Repo is public, so Actions minutes are unlimited (public repos don't
# consume the free-tier minutes quota that private repos do).
#
# GitHub's native `schedule:` trigger turned out to be unreliable at this
# frequency - it's "best effort" with no SLA, and under load it silently
# drops ticks rather than queuing them (confirmed: real gaps of 2-3+ hours
# despite an hourly cron). So this workflow no longer depends on it as the
# primary driver. Instead, each run explicitly triggers the next one itself
# via the GitHub API (workflow_dispatch), after waiting 15 minutes past its
# own completion - see the final "Wait, then trigger next run" step. That
# call fires immediately when made, skipping the flaky schedule-evaluation
# queue entirely.
#
# A low-frequency schedule is kept as a safety net only, in case the
# self-chain ever breaks (e.g. a run gets killed before its last step, or a
# GitHub Actions outage). If the chain is healthy, this backstop firing
# occasionally just means one extra video - harmless, not a duplicate
# problem - because of the concurrency lock below.
#
# Nudity detector: back on the bundled 320n model (2026-08-17). This
# pipeline briefly downloaded and used NudeNet's larger 640m model instead,
# hoping for better accuracy after the strikes. A week of real
# nsfw_test_log.json data instead showed a ~30% flag rate dominated
# (~90%) by a single class, FEMALE_BREAST_EXPOSED, at high confidence
# (0.4-0.85) on completely unrelated prompts ("spices being added",
# "modern city skyline", "waterfall pool jump") - a pattern, not
# borderline noise. NudeNet's own issue tracker (notAI-tech/NudeNet#150)
# independently corroborates that 640m catches FEWER real nudes than 320n
# at every confidence threshold in community benchmarks, so this isn't a
# safety-for-noise tradeoff either way - 320n is strictly the safer,
# better-tested choice. Switched back by simply no longer downloading
# 640m.onnx or setting NUDENET_MODEL_PATH; generate_short.py's
# _get_nude_detector() already falls back to the bundled default whenever
# that env var isn't set.
on:
  schedule:
    - cron: "23 */3 * * *"   # backstop only, off-peak minute
  workflow_dispatch: {}      # lets you trigger it manually, or restart the chain if it ever stalls

# Queues overlapping triggers instead of running them in parallel - keeps
# the self-chain and the backstop schedule from ever racing on git state.
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        # fonts-noto-core bundles Noto Sans Devanagari alongside Latin - no
        # separate "fonts-noto-devanagari" package exists on Ubuntu. Without
        # this, Hindi captions would render as blank boxes (default Ubuntu
        # fonts have no Devanagari glyphs).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Determine upload pause (Community Guidelines strike cool-down)
        # SECOND STRIKE (2026-08-19, "Mexico's Most Breathtaking Spot
        # #Shorts") - YouTube's own 2-week upload block runs through
        # ~2026-09-02; RESUME_DATE below adds a 1-day buffer, same pattern
        # as the first strike's cool-down.
        #
        # That video was fully clothed - NudeNet never flagged it and
        # never could, because YouTube's nudity/sexual-content policy is
        # broader than "exposed body parts" (it also covers content
        # "meant to be sexually gratifying" with nothing exposed at all).
        # NudeNet-based detection - the entire strategy this pipeline has
        # relied on - is structurally blind to that category, so waiting
        # out the 2 weeks alone does NOT fix why this happened. One more
        # strike terminates the channel.
        #
        # So there are two independent gates below, both required before
        # real uploads resume: the date (just clears YouTube's own API
        # block) AND DETECTION_GAP_FIXED (manually flip to "true" here,
        # deliberately, once there's an actual answer for the clothed/
        # sexualized-content gap - not before). Until both are true, every
        # run still executes the full pipeline in SKIP_UPLOAD test mode so
        # generation keeps getting exercised and logged.
        run: |
          RESUME_DATE="2026-09-03"
          DETECTION_GAP_FIXED="false"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$DETECTION_GAP_FIXED" != "true" ]]; then
            echo "Upload paused - DETECTION_GAP_FIXED is still false (clothed/sexualized-content detection gap from the 2026-08-19 second strike hasn't been addressed yet). Running in SKIP_UPLOAD test mode regardless of date."
            echo "SKIP_UPLOAD=true" >> "$GITHUB_ENV"
          elif [[ "$TODAY" < "$RESUME_DATE" ]]; then
            echo "Upload paused until $RESUME_DATE (today: $TODAY, second-strike cool-down). Running in SKIP_UPLOAD test mode."
            echo "SKIP_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "Past $RESUME_DATE and DETECTION_GAP_FIXED=true - resuming normal uploads."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      - name: Check for queued videos to catch up
        # Once SKIP_UPLOAD flips back to false (past RESUME_DATE above),
        # drain the backlog of videos generated-but-not-uploaded during the
        # cool-down before resuming normal generation - one queued video
        # per run, oldest first, so the whole backlog uploads gradually
        # (naturally spaced by the usual 15-min chain gap below) instead of
        # all at once. Uses DISPATCH_TOKEN (same token already used to
        # trigger the next run) to list artifacts via the REST API.
        id: check_queue
        if: env.SKIP_UPLOAD == 'false'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          RESP=$(curl -sf -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/abhigourking/TheCozyyRental-Youtube/actions/artifacts?per_page=100")
          PENDING=$(echo "$RESP" | jq -c '[.artifacts[] | select(.name | startswith("queued-video-")) | select(.expired == false)] | sort_by(.created_at)')
          PENDING_COUNT=$(echo "$PENDING" | jq 'length')
          echo "Queue status: $PENDING_COUNT video(s) waiting to be uploaded (also visible under this repo's Actions -> Artifacts, named queued-video-<run number>)."
          ARTIFACT_JSON=$(echo "$PENDING" | jq -c '.[0]')
          if [ "$ARTIFACT_JSON" = "null" ] || [ -z "$ARTIFACT_JSON" ]; then
            echo "No queued videos waiting - resuming normal generation this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(echo "$ARTIFACT_JSON" | jq -r '.id')" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$(echo "$ARTIFACT_JSON" | jq -r '.name')" >> "$GITHUB_OUTPUT"
            echo "run_id=$(echo "$ARTIFACT_JSON" | jq -r '.workflow_run.id')" >> "$GITHUB_OUTPUT"
            echo "Uploading oldest queued video: $(echo "$ARTIFACT_JSON" | jq -r '.name') ($((PENDING_COUNT - 1)) remaining after this)."
          fi

      - name: Download queued video artifact
        if: steps.check_queue.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.check_queue.outputs.artifact_name }}
          path: queued_video
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          repository: abhigourking/TheCozyyRental-Youtube
          run-id: ${{ steps.check_queue.outputs.run_id }}

      - name: Upload queued video (catch-up)
        id: upload_queued
        if: steps.check_queue.outputs.ready == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
        run: python generate_short.py --upload-queued queued_video/latest_short.mp4 queued_video/latest_short_meta.json

      - name: Delete consumed queued artifact
        # always() (both re: the job and re: upload_queued's outcome) -
        # NOT gated on upload succeeding. This used to only delete on
        # success, which meant a failing upload left the exact same
        # artifact at the front of the queue forever: every subsequent
        # run re-picked it, re-failed the same way, and (with the old
        # 60s fast-retry-on-failure below) re-triggered almost
        # immediately. That's confirmed to be what turned one blocked
        # upload (2026-08-19 second-strike API block) into ~2000 runs
        # over about two days, with no new content ever generated in
        # between because "Run pipeline" never got a turn. A failed
        # catch-up upload now gets discarded after one attempt instead of
        # retried indefinitely - if it failed for a real, persistent
        # reason (like an active strike restriction), retrying the exact
        # same video forever was never going to succeed anyway.
        if: always() && steps.check_queue.outputs.ready == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "${{ steps.upload_queued.outcome }}" != "success" ]; then
            echo "::warning::Catch-up upload failed (${{ steps.check_queue.outputs.artifact_name }}) - discarding this queued artifact instead of retrying it forever. Check the 'Upload queued video' step's log above for why."
          fi
          curl -sf -X DELETE -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/abhigourking/TheCozyyRental-Youtube/actions/artifacts/${{ steps.check_queue.outputs.artifact_id }}" \
          && echo "Consumed artifact deleted." \
          || echo "::warning::Failed to delete consumed artifact ${{ steps.check_queue.outputs.artifact_id }} - it'll just sit there expired/unused, harmless."

      - name: Run pipeline
        id: run_pipeline
        if: steps.check_queue.outputs.ready != 'true'
        env:
          SKIP_UPLOAD: ${{ env.SKIP_UPLOAD }}
          # NUDENET_MODEL_PATH deliberately left unset - see "Nudity
          # detector: back on the bundled 320n model" comment near the top
          # of this file. generate_short.py's _get_nude_detector() already
          # falls back cleanly to the bundled default model whenever this
          # isn't a real file path.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional fallback key from a SEPARATE Groq account (its own
          # independent daily token quota - Groq rate-limits per
          # organization, so a second key on the same account wouldn't
          # help). generate_script() switches to this automatically only
          # when the primary key hits its per-day quota specifically, not
          # for other errors. Safe to leave unset - falls back to
          # primary-key-only behavior.
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
          USE_TRENDING: "true"        # pull from Reddit trending (niche subs) with safety filtering; falls back to topics.json
          MAX_ATTEMPTS: "1"           # no retry-with-new-topic - each retry re-downloads a full batch of images against a tight free-tier image API limit
        run: python generate_short.py

      - name: Queue generated video as artifact (upload paused)
        # Nothing generated during the strike cool-down would otherwise
        # survive past this job - the runner and its filesystem are thrown
        # away at the end of every run. Packaging the video + the metadata
        # it would've been uploaded with (see run_once()'s SKIP_UPLOAD
        # branch) into an artifact means the "Check for queued videos"
        # step above can find and publish it later, once uploads resume.
        #
        # Gated on latest_short_meta.json actually existing (not just the
        # pipeline step succeeding): run_once() deliberately skips writing
        # that file whenever the NudeNet check flagged anything at all
        # during generation, even if the final video only used visuals
        # that passed - so a video that ever triggered a flag can never
        # end up queued for auto-upload, full stop. hashFiles() here
        # matches actual queue-worthiness to that same rule instead of
        # just trusting the pipeline step's exit code.
        if: always() && env.SKIP_UPLOAD == 'true' && steps.run_pipeline.outcome == 'success' && hashFiles('output/latest_short_meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: queued-video-${{ github.run_number }}
          path: |
            output/latest_short.mp4
            output/latest_short_meta.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit updated state
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add topics.json
          [ -f performance_log.json ] && git add performance_log.json
          [ -f nsfw_test_log.json ] && git add nsfw_test_log.json
          [ -f error_log.json ] && git add error_log.json
          [ -f flagged_prompts.json ] && git add flagged_prompts.json
          git commit -m "chore: advance state [skip ci]" || echo "nothing to commit"

          # Retry on non-fast-forward rejection (another push landed on
          # master in between - a code push, a manual trigger, or another
          # run's own state commit). A plain "git rebase" occasionally hit a
          # real conflict here: performance_log.json is a plain JSON array,
          # and if two runs both appended a video entry around the same
          # time, git's line-based merge can't reconcile two inserts at the
          # same spot (the closing bracket). Once that happens, resolve it
          # in Python instead of fighting git's text merge: keep our own
          # freshly-uploaded video's entry, reset everything else to
          # origin's latest, and union the video lists by video_id so
          # neither side's entry is silently dropped. The video has already
          # uploaded by this point either way - this only affects whether
          # its stats get tracked for future category weighting.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected, retrying ($i/5)..."
            git fetch origin master

            if git rebase origin/master; then
              sleep $((RANDOM % 10 + 5))
              continue
            fi
            echo "Rebase hit a real conflict - resolving state files by merging instead of losing this run's entries..."
            git rebase --abort

            # Back up EVERY bot-managed append-log before the hard reset
            # below wipes the working tree back to origin's version -
            # not just performance_log.json. This used to only protect
            # performance_log.json, which meant nsfw_test_log.json,
            # error_log.json, and flagged_prompts.json entries from this
            # run were silently discarded on every conflict (confirmed:
            # this is why ~4 days of nsfw_test_log.json data went missing
            # during the NudeNet test week - see merge_state_logs.py).
            cp performance_log.json /tmp/ours_performance_log.json 2>/dev/null || echo '{"videos": []}' > /tmp/ours_performance_log.json
            [ -f nsfw_test_log.json ] && cp nsfw_test_log.json /tmp/ours_nsfw_test_log.json
            [ -f error_log.json ] && cp error_log.json /tmp/ours_error_log.json
            [ -f flagged_prompts.json ] && cp flagged_prompts.json /tmp/ours_flagged_prompts.json
            git reset --hard origin/master
            python3 merge_performance_log.py
            python3 merge_state_logs.py

            git add performance_log.json
            [ -f nsfw_test_log.json ] && git add nsfw_test_log.json
            [ -f error_log.json ] && git add error_log.json
            [ -f flagged_prompts.json ] && git add flagged_prompts.json
            git commit -m "chore: advance state (merged after conflict) [skip ci]" || echo "nothing to commit after merge"
            sleep $((RANDOM % 10 + 5))
          done

      - name: Wait, then trigger the next run
        # always() so the chain keeps going even if an earlier step failed
        # (e.g. upload error) - one bad run shouldn't permanently stall the
        # whole pipeline. But NOT !cancelled() - always() alone also fires
        # after a manual cancellation, which meant cancelling a run still
        # slept 30 min and dispatched the next one anyway, ignoring the
        # cancel entirely. With !cancelled() added, a manual cancel now
        # stops the chain as you'd expect; only genuine step failures keep
        # it alive. Uses DISPATCH_TOKEN (a token with "Actions: Read and
        # write" permission) because the default GITHUB_TOKEN is
        # deliberately blocked from triggering further workflow runs, to
        # prevent infinite-loop workflows.
        #
        # Wait length depends on whether "Run pipeline" specifically
        # succeeded:
        #   - success -> full 15 min gap (normal posting cadence)
        #   - failure -> short 60s wait, then retry right away. Most
        #     failures we've seen there are transient (a flaky Groq/
        #     YouTube API call, a bad TTS voice on one specific country/
        #     language combo) and self-fixing code (regeneration loops,
        #     English fallback) already reduces how often this path is
        #     even hit. 60s (not 0s) avoids hammering APIs in a tight loop
        #     if something is failing every single time - it still gives
        #     a fixable failure a fast retry without waiting a full 15 min.
        #
        # Deliberately does NOT fast-retry on upload_queued failures
        # anymore (it used to, alongside run_pipeline). A catch-up-upload
        # failure isn't necessarily transient the way a flaky API call
        # is - it can be a real, persistent restriction (an active
        # strike's upload block lasts up to 2 weeks) - and combined with
        # the "Delete consumed queued artifact" step above now always
        # discarding the failed item, a 60s retry loop here would burn
        # through the entire remaining queue in minutes instead of at the
        # normal ~15-min pace. This is exactly the combination (artifact
        # never cleared + 60s retry on this specific failure) that turned
        # one blocked upload into ~2000 runs on 2026-08-19/20 with the
        # self-chain never once reaching "Run pipeline" in between.
        if: always() && !cancelled()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "${{ steps.run_pipeline.outcome }}" = "failure" ]; then
            echo "Pipeline step failed - short 60s wait before retrying, instead of the full 15 min gap."
            sleep 60
          else
            sleep 900   # 15 min gap - normal posting cadence, and also how long a failed-but-discarded catch-up upload waits before the next queue item gets a turn
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abhigourking/TheCozyyRental-Youtube/actions/workflows/daily-short.yml/dispatches \
            -d '{"ref":"master"}' \
          && echo "Next run triggered." \
          || echo "::warning::Failed to trigger next run - DISPATCH_TOKEN may be missing/expired, or backstop schedule will eventually catch it."
