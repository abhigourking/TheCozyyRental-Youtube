name: Generate and Upload Shorts (self-chained, ~15 min gap after each run)

# Repo is public, so Actions minutes are unlimited (public repos don't
# consume the free-tier minutes quota that private repos do).
#
# GitHub's native `schedule:` trigger turned out to be unreliable at this
# frequency - it's "best effort" with no SLA, and under load it silently
# drops ticks rather than queuing them (confirmed: real gaps of 2-3+ hours
# despite an hourly cron). So this workflow no longer depends on it as the
# primary driver. Instead, each run explicitly triggers the next one itself
# via the GitHub API (workflow_dispatch), after waiting 15 minutes past its
# own completion - see the final "Wait, then trigger next run" step. That
# call fires immediately when made, skipping the flaky schedule-evaluation
# queue entirely.
#
# A low-frequency schedule is kept as a safety net only, in case the
# self-chain ever breaks (e.g. a run gets killed before its last step, or a
# GitHub Actions outage). If the chain is healthy, this backstop firing
# occasionally just means one extra video - harmless, not a duplicate
# problem - because of the concurrency lock below.
on:
  schedule:
    - cron: "23 */3 * * *"   # backstop only, off-peak minute
  workflow_dispatch: {}      # lets you trigger it manually, or restart the chain if it ever stalls

# Queues overlapping triggers instead of running them in parallel - keeps
# the self-chain and the backstop schedule from ever racing on git state.
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        # fonts-noto-core bundles Noto Sans Devanagari alongside Latin - no
        # separate "fonts-noto-devanagari" package exists on Ubuntu. Without
        # this, Hindi captions would render as blank boxes (default Ubuntu
        # fonts have no Devanagari glyphs).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache NudeNet 640m model
        id: nudenet_cache
        uses: actions/cache@v4
        with:
          path: models/640m.onnx
          key: nudenet-640m-onnx-v1

      - name: Download NudeNet 640m model
        # Larger/more accurate nudity-detection model than the bundled
        # default (320n) - not shipped in the pip package, so it's fetched
        # once here and cached across runs (~100MB, cache avoids re-pulling
        # it on every single run). If this download ever fails, the
        # pipeline still runs fine - generate_short.py falls back to the
        # bundled default model when NUDENET_MODEL_PATH isn't a real file.
        if: steps.nudenet_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sfL -o models/640m.onnx \
            https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/640m.onnx \
          || echo "::warning::NudeNet 640m model download failed - pipeline will fall back to the bundled default model."

      - name: Determine upload pause (Community Guidelines strike cool-down)
        # The channel got a 1-strike Community Guidelines restriction
        # (nudity) on 2026-08-11 - YouTube blocks uploads for 7 days from a
        # strike. RESUME_DATE below is +8 days as a buffer. Until then,
        # every run still executes the FULL pipeline (topic pick, script,
        # images, the NudeNet nudity check, TTS, video assembly) so we keep
        # exercising and logging the detection logic all week (see
        # nsfw_test_log.json) - it just sets SKIP_UPLOAD=true so it never
        # calls the YouTube API and can't hit the strike's 403. That also
        # means these runs finish as a normal *success*, so the self-chain
        # takes its normal 15-min gap instead of the 60s failure-retry loop
        # hammering the API every minute for a week.
        run: |
          RESUME_DATE="2026-08-19"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" < "$RESUME_DATE" ]]; then
            echo "Upload paused until $RESUME_DATE (today: $TODAY, strike cool-down). Running in SKIP_UPLOAD test mode."
            echo "SKIP_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "Past $RESUME_DATE - resuming normal uploads."
            echo "SKIP_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      - name: Run pipeline
        id: run_pipeline
        env:
          SKIP_UPLOAD: ${{ env.SKIP_UPLOAD }}
          NUDENET_MODEL_PATH: ${{ github.workspace }}/models/640m.onnx
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional fallback key from a SEPARATE Groq account (its own
          # independent daily token quota - Groq rate-limits per
          # organization, so a second key on the same account wouldn't
          # help). generate_script() switches to this automatically only
          # when the primary key hits its per-day quota specifically, not
          # for other errors. Safe to leave unset - falls back to
          # primary-key-only behavior.
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
          USE_TRENDING: "true"        # pull from Reddit trending (niche subs) with safety filtering; falls back to topics.json
          MAX_ATTEMPTS: "1"           # no retry-with-new-topic - each retry re-downloads a full batch of images against a tight free-tier image API limit
        run: python generate_short.py

      - name: Commit updated state
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add topics.json
          [ -f performance_log.json ] && git add performance_log.json
          [ -f nsfw_test_log.json ] && git add nsfw_test_log.json
          [ -f error_log.json ] && git add error_log.json
          git commit -m "chore: advance state [skip ci]" || echo "nothing to commit"

          # Retry on non-fast-forward rejection (another push landed on
          # master in between - a code push, a manual trigger, or another
          # run's own state commit). A plain "git rebase" occasionally hit a
          # real conflict here: performance_log.json is a plain JSON array,
          # and if two runs both appended a video entry around the same
          # time, git's line-based merge can't reconcile two inserts at the
          # same spot (the closing bracket). Once that happens, resolve it
          # in Python instead of fighting git's text merge: keep our own
          # freshly-uploaded video's entry, reset everything else to
          # origin's latest, and union the video lists by video_id so
          # neither side's entry is silently dropped. The video has already
          # uploaded by this point either way - this only affects whether
          # its stats get tracked for future category weighting.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected, retrying ($i/5)..."
            git fetch origin master

            if git rebase origin/master; then
              sleep $((RANDOM % 10 + 5))
              continue
            fi
            echo "Rebase hit a real conflict - resolving performance_log.json by merging video lists..."
            git rebase --abort

            cp performance_log.json /tmp/ours_performance_log.json 2>/dev/null || echo '{"videos": []}' > /tmp/ours_performance_log.json
            git reset --hard origin/master
            python3 merge_performance_log.py

            git add performance_log.json
            git commit -m "chore: advance state (merged after conflict) [skip ci]" || echo "nothing to commit after merge"
            sleep $((RANDOM % 10 + 5))
          done

      - name: Wait, then trigger the next run
        # always() so the chain keeps going even if an earlier step failed
        # (e.g. upload error) - one bad run shouldn't permanently stall the
        # whole pipeline. But NOT !cancelled() - always() alone also fires
        # after a manual cancellation, which meant cancelling a run still
        # slept 30 min and dispatched the next one anyway, ignoring the
        # cancel entirely. With !cancelled() added, a manual cancel now
        # stops the chain as you'd expect; only genuine step failures keep
        # it alive. Uses DISPATCH_TOKEN (a token with "Actions: Read and
        # write" permission) because the default GITHUB_TOKEN is
        # deliberately blocked from triggering further workflow runs, to
        # prevent infinite-loop workflows.
        #
        # Wait length depends on whether the pipeline step succeeded:
        #   - success -> full 15 min gap (normal posting cadence)
        #   - failure -> short 60s wait, then retry right away. Most
        #     failures we've seen are transient (a flaky Groq/YouTube API
        #     call, a bad TTS voice on one specific country/language
        #     combo) and self-fixing code (regeneration loops, English
        #     fallback) already reduces how often this path is even hit.
        #     60s (not 0s) avoids hammering APIs in a tight loop if
        #     something is failing every single time - it still gives a
        #     fixable failure a fast retry without waiting a full 15 min.
        if: always() && !cancelled()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "${{ steps.run_pipeline.outcome }}" = "failure" ]; then
            echo "Pipeline step failed - short 60s wait before retrying, instead of the full 15 min gap."
            sleep 60
          else
            sleep 900   # 15 min gap after a successful run, then chain the next
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abhigourking/TheCozyyRental-Youtube/actions/workflows/daily-short.yml/dispatches \
            -d '{"ref":"master"}' \
          && echo "Next run triggered." \
          || echo "::warning::Failed to trigger next run - DISPATCH_TOKEN may be missing/expired, or backstop schedule will eventually catch it."
