name: Generate and Upload Shorts (every 4 hours, 6x/day)

on:
  schedule:
    # Every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        # fonts-noto-core covers Latin (English captions), fonts-noto-devanagari
        # covers Hindi captions - without the latter, Hindi text renders as
        # blank boxes since the default Ubuntu fonts have no Devanagari glyphs.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-devanagari

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Random jitter delay
        run: sleep $((RANDOM % 1200))   # 0-20 min random delay, avoids exact-clock posting pattern

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
          USE_TRENDING: "true"        # pull from Reddit trending (niche subs) with safety filtering; falls back to topics.json
          MAX_ATTEMPTS: "1"           # no retry-with-new-topic - each retry re-downloads a full batch of images against a tight free-tier image API limit
        run: python generate_short.py

      - name: Commit updated topic pointer
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add topics.json
          git commit -m "chore: advance topic pointer [skip ci]" || echo "nothing to commit"
          git push
