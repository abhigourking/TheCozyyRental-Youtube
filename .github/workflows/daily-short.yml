name: Generate and Upload Shorts (every hour, 24x/day)

# Repo is public, so Actions minutes are unlimited (public repos don't
# consume the free-tier minutes quota that private repos do). Schedule is
# live: this is the sole active scheduler for the pipeline. Manual trigger
# also still works via workflow_dispatch.
on:
  schedule:
    # Every hour, on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

# The pipeline run takes ~30 min. With an hourly trigger, if a run ever
# takes longer than usual (API slowness, fallback retries), this stops the
# next hour's trigger from starting a second run in parallel - it queues
# instead, so they never race on git state or double-post.
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        # fonts-noto-core bundles Noto Sans Devanagari alongside Latin - no
        # separate "fonts-noto-devanagari" package exists on Ubuntu. Without
        # this, Hindi captions would render as blank boxes (default Ubuntu
        # fonts have no Devanagari glyphs).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Random jitter delay
        run: sleep $((RANDOM % 240))   # 0-4 min random delay - kept short since the ~30 min run needs to comfortably finish inside the hour

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
          USE_TRENDING: "true"        # pull from Reddit trending (niche subs) with safety filtering; falls back to topics.json
          MAX_ATTEMPTS: "1"           # no retry-with-new-topic - each retry re-downloads a full batch of images against a tight free-tier image API limit
        run: python generate_short.py

      - name: Commit updated state
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add topics.json
          [ -f performance_log.json ] && git add performance_log.json
          git commit -m "chore: advance state [skip ci]" || echo "nothing to commit"
          # Retry on non-fast-forward rejection (another push landed on master
          # in between, e.g. a manual commit or an overlapping run) - rebase
          # onto the latest remote state and try again, a few times before
          # giving up. The video has already uploaded by this point either
          # way; this just makes sure the rotation state isn't silently lost.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected, retrying ($i/5)..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 10 + 5))
          done
