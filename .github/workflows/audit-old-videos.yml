name: Audit old videos against current NudeNet detector (manual only)

# One-off backlog audit - checks videos posted BEFORE the current NudeNet
# detector existed, since none of them were ever actually scanned by it.
# Deliberately NOT self-chaining and NOT on any schedule: this can delete
# videos permanently, so every batch is a separate, deliberate
# workflow_dispatch you trigger yourself. Re-run with the same inputs to
# keep working through the backlog - already-audited videos are skipped
# (see old_video_audit.json, committed back after each run like the other
# state files).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = check + log only, never deletes. false = actually delete flagged videos (also requires confirm_delete below)."
        required: true
        default: "true"
      confirm_delete:
        description: "Must be exactly DELETE to allow dry_run=false to delete anything. Leave blank for a dry run."
        required: false
        default: ""
      batch_size:
        description: "How many not-yet-audited videos to process this run."
        required: true
        default: "25"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run audit batch
        # NUDENET_MODEL_PATH deliberately unset - back on the bundled 320n
        # model (2026-08-17), same reasoning as daily-short.yml: real
        # nsfw_test_log.json data showed 640m producing a systematic
        # high-confidence false-flag pattern on one class, and NudeNet's
        # own issue tracker (notAI-tech/NudeNet#150) independently found
        # 640m catches fewer real nudes than 320n at every threshold. Using
        # the same detector as the live pipeline also keeps this audit
        # consistent with what actually gates uploads.
        id: run_audit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
          AUDIT_BATCH_SIZE: ${{ inputs.batch_size }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python audit_old_videos.py

      - name: Commit audit log
        # always() so progress still gets saved even if "Run audit batch"
        # fails or the job gets cancelled/times out partway through a big
        # batch - save_audit_log() writes to disk after every single video,
        # so whatever's on disk at this point is real, checked progress
        # and shouldn't be thrown away just because something later in the
        # batch (or the runner itself) had a problem.
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add old_video_audit.json
          git commit -m "chore: old-video audit progress [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejected, retrying ($i/3)..."
            git fetch origin master
            git rebase origin/master || { git rebase --abort; git reset --hard origin/master; }
            sleep 5
          done
